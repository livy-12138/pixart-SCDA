name: pixart-linux
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # CUDA 12.1 PyTorch wheels. NVIDIA driver 530+ is required.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.1+cu121
      - torchvision==0.16.1+cu121
      - torchaudio==2.1.1+cu121
      - -r requirements-linux.txt
